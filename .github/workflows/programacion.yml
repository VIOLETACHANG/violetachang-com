name: Publicar Noticias Programadas
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: date > .ultima-actualizacion
      - run: |
          git config user.name "Robot Editorial"
          git config user.email "prensa@violetachang.com"
          git add .ultima-actualizacion
          git commit -m "Actualización programada" || exit 0
          git push

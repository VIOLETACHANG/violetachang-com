name: Publicar Noticias Programadas

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicacion-programada-main
  cancel-in-progress: false

jobs:
  rebuild-for-scheduled-news:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Crear commit que dispara la reconstrucción de Cloudflare Pages
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .ultima-actualizacion
          git config user.name "Robot Editorial"
          git config user.email "prensa@violetachang.com"
          git add .ultima-actualizacion
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
            exit 0
          fi
          git commit -m "Actualización diaria de noticias programadas"
          git push origin HEAD:main
